<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BODTÜM & ODTÜ | Canlı Oylama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=7">
  <style>
    /* Voter Screen Minimal Layout */
    .voter-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .voter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 20px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .voter-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 5px 12px;
      border-radius: var(--radius-md);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .voter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 20px;
    }

    .voter-title {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.35;
      color: #fff;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .voter-sub {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    /* Options Tap Targets */
    .voter-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .voter-opt-btn {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 500;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
    }

    .voter-opt-btn:hover {
      border-color: var(--border-strong);
    }

    .voter-opt-btn.selected {
      background: rgba(37, 99, 235, 0.15);
      border-color: #3b82f6;
      color: #ffffff;
    }

    .opt-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
      transition: all var(--transition);
    }

    .voter-opt-btn.selected .opt-circle {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #fff;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      background: #ffffff;
      color: #090b10;
      border: none;
      cursor: pointer;
      margin-top: 14px;
      transition: all var(--transition);
    }

    .btn-submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Voted State */
    .success-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 32px 24px;
      text-align: center;
      margin-bottom: 20px;
    }

    .success-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--status-green);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .waiting-text {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-tertiary);
      margin-top: 14px;
    }

    .spinner-sm {
      width: 12px;
      height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--text-primary);
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="voter-container">
    <!-- Clean Header -->
    <header class="voter-header" style="background: none; border-bottom: 1px solid var(--border); padding: 0 0 16px 0;">
      <div class="voter-brand">
        <img src="./odtu-logo.png" alt="ODTÜ" style="height: 26px; width: auto; display: block;">
        <div style="width: 1px; height: 18px; background: #e2e8f0;"></div>
        <img src="./bodtum-logo.png" alt="BODTÜM" style="height: 26px; width: auto; display: block;">
      </div>
      <div class="pill" id="voterProgressTag" style="padding: 4px 10px; font-size: 0.75rem;">Bağlanıyor...</div>
    </header>

    <!-- Question View -->
    <div id="activeQuestionView">
      <div class="voter-card">
        <h2 class="voter-title" id="voterQTitle">Soru yükleniyor...</h2>
        <div class="voter-sub" id="voterQSubtitle"></div>
        <div class="voter-options" id="voterInputArea">
          <!-- Dynamically injected choices -->
        </div>
      </div>

      <button class="btn-submit" id="voterSubmitBtn" disabled>
        Cevabı Gönder
      </button>
    </div>

    <!-- Feedback View -->
    <div id="votedFeedbackView" style="display: none;">
      <div class="success-box">
        <div class="success-icon">✓</div>
        <h3 style="font-size: 1.25rem; font-weight: 600; color: #fff; margin-bottom: 4px;">Cevabınız Kaydedildi</h3>
        <p style="color: var(--text-secondary); font-size: 0.86rem;">Oyunuz canlı sunum ekranına yansıtıldı.</p>
        <div class="waiting-text">
          <div class="spinner-sm"></div>
          <span>Sonraki soru bekleniyor...</span>
        </div>
      </div>

      <!-- Live Crowd Breakdown -->
      <div class="voter-card">
        <div style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-tertiary); margin-bottom: 14px;">
          Katılımcı Dağılımı
        </div>
        <div id="voterLiveResults"></div>
      </div>
    </div>

    <!-- Locked View -->
    <div id="lockedView" style="display: none;">
      <div class="voter-card" style="text-align: center; padding: 40px 20px;">
        <h3 style="font-size: 1.15rem; margin-bottom: 6px;">Oylama Duraklatıldı</h3>
        <p style="color: var(--text-secondary); font-size: 0.85rem;">Sunucu oylamayı geçici olarak durdurdu.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <script src="./vote.js?v=7"></script>
</body>
</html>
